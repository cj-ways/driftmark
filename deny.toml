# cargo-deny: licences, sources and known advisories of every dependency.
# A new licence is added here only with a reason, in the same commit as the
# dependency that needs it.
[graph]
all-features = true

[advisories]
yanked = "deny"
# rustybuzz and ttf-parser were marked unmaintained in 2026; neither has a
# known vulnerability. merman measures diagram text with real fonts through
# them (decision 0008, item 5), and merman 0.9 has no other way. Remove these
# two lines when merman moves to their successors, harfrust and skrifa.
ignore = ["RUSTSEC-2026-0192", "RUSTSEC-2026-0206"]

[licenses]
# Reasons: docs/decisions/0008-engine-choices-from-the-m1-spikes.md, item 8.
# BSD-2-Clause: comrak. Zlib: gix. Unicode-*: Unicode data tables.
# BSD-3-Clause, MPL-2.0: merman's dependencies. EPL-2.0: merman's ELK layout.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "EPL-2.0",
]
confidence-threshold = 0.9

[bans]
# A warning, not a refusal as in acctswap: a server, a search index and a
# Markdown parser pull in large dependency trees where two versions of one
# crate are common and harmless.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

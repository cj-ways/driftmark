[package]
name = "driftmark-core"
description = "The rules of driftmark: document blocks, change detection and ranking, note anchoring and lint rules. No file, git or network access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# What crates.io gets: the code, the starter files and the browser script it
# builds in, and the licences. Tests stay in the repository: they read
# fixtures outside this folder.
include = ["/src/", "/starter/", "/web/", "/LICENSE-MIT", "/LICENSE-APACHE"]
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
comrak = { version = "0.56.0", default-features = false }
glob = "0.3.4"
saphyr-parser = "0.2.2"
serde = { version = "1.0.228", features = ["derive", "rc"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
twox-hash = { version = "2.1.5", default-features = false, features = ["xxhash3_64"] }
# Unicode word boundaries (UAX #29) for search. Already in the build through
# merman-core, so it adds no crate.
unicode-segmentation = "1.13.3"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"

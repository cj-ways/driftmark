[package]
name = "driftmark-core"
description = "The engine of driftmark: Markdown blocks, ranked change detection, note anchoring, search and lint rules, with no file, git or network access"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["markdown", "diff", "lint", "annotation", "documentation"]
categories = ["text-processing", "development-tools"]

[dependencies]
comrak = { version = "0.56.0", default-features = false }
glob = "0.3.4"
saphyr-parser = "0.2.2"
serde = { version = "1.0.228", features = ["derive", "rc"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
twox-hash = { version = "2.1.5", default-features = false, features = ["xxhash3_64"] }
# Unicode word boundaries (UAX #29) for search. Already in the build through
# merman-core, so it adds no crate.
unicode-segmentation = "1.13.3"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"

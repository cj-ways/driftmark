[package]
name = "driftmark-core"
description = "The rules of driftmark: document blocks, change detection and ranking, note anchoring and lint rules. No file, git or network access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
comrak = { version = "0.56.0", default-features = false }
glob = "0.3.4"
saphyr-parser = "0.2.2"
serde = { version = "1.0.228", features = ["derive"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
twox-hash = { version = "2.1.5", default-features = false, features = ["xxhash3_64"] }

[lints]
workspace = true

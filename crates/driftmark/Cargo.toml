[package]
name = "driftmark"
description = "See what your AI agents changed in your Markdown docs, whether it matters, and answer back with notes"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "driftmark"
path = "src/main.rs"

[dependencies]
driftmark-core = { path = "../driftmark-core", version = "0.0.0" }
# Reads git without starting processes (decision 0008, item 1). Pinned: each
# 0.x release may break the API. Default features are off because they pull in
# a pack cache under MPL-2.0; `pack-cache-lru-dynamic` caps the cache by bytes
# instead. `dirwalk` finds untracked files for the working-tree side.
gix = { version = "=0.89.0", default-features = false, features = [
  "sha1",
  "parallel",
  "pack-cache-lru-dynamic",
  "revision",
  "index",
  "dirwalk",
] }
# Mermaid's parser without its layout and SVG parts, for the lint's diagram
# rule (decision 0008 chose merman). Pinned: each 0.x release may break the
# API. Every diagram family is on, so any diagram GitHub draws is checked.
merman-core = { version = "=0.9.0", default-features = false, features = ["all-diagrams"] }
# Draws Mermaid on the server for the pages (decision 0008, item 5): every
# diagram family, SVG with the ELK and Cytoscape layouts and math labels
# (merman's defaults), plus `native-fonts`, so text is measured with the
# Liberation Sans files the program ships instead of merman's width guess.
merman = { version = "=0.9.0", default-features = false, features = [
  "all-diagrams",
  "complete-svg-elk",
  "native-fonts",
] }
# Reads each drawing as XML so it can be written out again from an
# allow-list before it goes into a page; already a dependency of merman.
quick-xml = "0.42.0"
# Unpacks the built-in mermaid.js, which is stored compressed, for the rare
# browser that does not accept gzip; already a dependency of tower-http's
# compression.
flate2 = "1.1.10"
# The HTTP server of `driftmark serve`. axum runs on tokio, which M3's MCP
# connector (rmcp) needs too, and rmcp's HTTP transport is a tower service
# that mounts in an axum router, so both share one program and one runtime.
# Only HTTP/1 is on; the browser and the phone need nothing more.
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
tokio = { version = "1.53.3", default-features = false, features = [
  "rt-multi-thread",
  "net",
  "signal",
  "sync",
  "time",
  "macros",
] }
# gzip for every answer except the event stream.
tower-http = { version = "0.7.1", default-features = false, features = ["compression-gzip"] }
# Builds the event stream of `/events`; already a dependency of axum.
futures-util = { version = "0.3.34", default-features = false }
# The random token for an address beyond this machine; already a dependency
# of tempfile through gix.
getrandom = "0.4.3"
# Reads and writes the paths and branch names in page addresses; already a
# dependency of gix.
percent-encoding = "2.3.2"
# The MCP connector of `driftmark mcp` (decision 0003): the Model Context
# Protocol over standard input and output. Pinned: rmcp had three major
# versions in 2026, so only `src/mcp/protocol.rs` names it. No macros and no
# HTTP: the server side and the stdio transport are all the command needs.
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
# Serializes the server's JSON answers.
serde = { version = "1.0.228", features = ["derive"] }
# The notes file (decision 0004): one SQLite database in the clone's shared
# git folder, which `serve` and the coming `mcp` command open at the same
# time in WAL mode. `bundled` builds SQLite from its C source, so no system
# library is needed on any of the three systems.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
# Reads Claude Code's hook input and `.claude/settings.json`, and writes
# `--json` output. `preserve_order` keeps the keys of a settings file in their
# written order when the hook installer adds its entry.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
# Today's date in the local time zone, for the `date` of a document that
# `driftmark new` starts; already a dependency of gix (through gix-date),
# with these default features, so it adds no crate.
jiff = "0.2.38"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"

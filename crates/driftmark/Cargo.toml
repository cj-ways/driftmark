[package]
name = "driftmark"
description = "See what your AI agents changed in your Markdown docs, whether it matters, and answer back with notes"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "driftmark"
path = "src/main.rs"

[dependencies]
driftmark-core = { path = "../driftmark-core", version = "0.0.0" }
# Reads git without starting processes (decision 0008, item 1). Pinned: each
# 0.x release may break the API. Default features are off because they pull in
# a pack cache under MPL-2.0; `pack-cache-lru-dynamic` caps the cache by bytes
# instead. `dirwalk` finds untracked files for the working-tree side.
gix = { version = "=0.89.0", default-features = false, features = [
  "sha1",
  "parallel",
  "pack-cache-lru-dynamic",
  "revision",
  "index",
  "dirwalk",
] }
# Mermaid's parser without its layout and SVG parts, for the lint's diagram
# rule (decision 0008 chose merman). Pinned: each 0.x release may break the
# API. Every diagram family is on, so any diagram GitHub draws is checked.
merman-core = { version = "=0.9.0", default-features = false, features = ["all-diagrams"] }
# Reads Claude Code's hook input and `.claude/settings.json`, and writes
# `--json` output. `preserve_order` keeps the keys of a settings file in their
# written order when the hook installer adds its entry.
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"

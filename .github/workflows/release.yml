name: release

# A `v*` tag on main builds driftmark for six systems, publishes the GitHub release, then
# crates.io, PyPI and npm through trusted publishing (no stored tokens). Run by hand, it builds and
# packs every file and publishes nothing. The environments crates-io, pypi and npm accept only `v*`
# tags. The shape follows cj-ways/acctswap's release.yml; docs/features/install.md describes what
# users get.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing by default; each job asks only for what it needs. Actions are pinned to commits.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # THIRD-PARTY-NOTICES, written once and packed into every archive, wheel and npm package.
  notices:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      # cargo-about's own release file, checked against the checksum it publishes.
      - name: Install cargo-about 0.9.2
        run: |
          curl -fsSL -o cargo-about.tar.gz \
            https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz
          echo "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af  cargo-about.tar.gz" | sha256sum -c -
          tar -xzf cargo-about.tar.gz --strip-components=1 -C "$HOME/.cargo/bin" \
            cargo-about-0.9.2-x86_64-unknown-linux-musl/cargo-about
      - run: node scripts/notices/third-party-notices.mjs THIRD-PARTY-NOTICES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices
          path: THIRD-PARTY-NOTICES

  build:
    needs: notices
    permissions:
      contents: read
    strategy:
      # One system failing, or waiting too long for a runner, leaves the others to finish, so
      # "Re-run failed jobs" redoes only that one. Nothing publishes until all six are built.
      fail-fast: false
      matrix:
        # Explicit runner labels, not *-latest, so a label moving to a new image does not change
        # a release. macOS arm64 runners are short of capacity (GitHub's notice, 2026-10): the
        # Intel build runs on an Intel runner and does not wait on that queue.
        # `run` says whether the runner can start the program it built.
        include:
          - { os: macos-15, target: aarch64-apple-darwin, run: true }
          - { os: macos-15-intel, target: x86_64-apple-darwin, run: true }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, run: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, run: true }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, run: true }
          - { os: windows-2025, target: aarch64-pc-windows-msvc, run: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # On Linux, zig links the program against glibc 2.28 (decision 0011: glibc, not musl), so it
      # runs on any distribution from 2018 on; the runner's own glibc is much newer.
      - run: pip install maturin==1.15.0 ${{ contains(matrix.target, '-linux-') && 'ziglang==0.15.2' || '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
      # maturin builds the program (into target/<target>/release, as cargo does) and the PyPI wheel
      # around it. On Linux it also refuses a program that needs a glibc newer than 2.28.
      - run: >-
          maturin build --release --locked --target ${{ matrix.target }} --out wheels
          ${{ contains(matrix.target, '-linux-') && '--zig --compatibility manylinux_2_28' || '' }}
      - if: matrix.run
        name: Start the program
        shell: bash
        run: |
          out=$("target/${{ matrix.target }}/release/driftmark" --version | tr -d '\r')
          echo "$out"
          v=$(cargo pkgid -p driftmark | tr -d '\r')
          [ "$out" = "driftmark ${v##*[#@]}" ]
      # AlmaLinux 8 has glibc 2.28, the oldest the Linux program promises to run on.
      - if: contains(matrix.target, '-linux-')
        name: Start the program on glibc 2.28
        run: >-
          docker run --rm --network none -v "$PWD/target/${{ matrix.target }}/release:/p:ro"
          docker.io/library/almalinux:8 sh -c 'ldd --version | head -n 1 && /p/driftmark --version'
      - name: Package
        shell: bash
        run: bash scripts/archive.sh ${{ matrix.target }} dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: driftmark-${{ matrix.target }}
          path: dist/driftmark-${{ matrix.target }}.*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: wheels/*.whl

  # Checks the tag against Cargo.toml and main, dry-runs the crates, checks the six wheels and
  # packs the npm packages, so a run by hand tests all of it before a tag.
  packages:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # main's history, for the check below
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - id: version
        run: |
          v=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "driftmark") | .version')
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$GITHUB_REF_NAME" != "v$v" ]; then
              echo "the tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($v)" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "the tag $GITHUB_REF_NAME is not on main" >&2
              exit 1
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: cargo publish --dry-run --locked --workspace
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: wheels
      # One wheel per system, each tagged for the system it runs on.
      - run: |
          ls -l wheels
          v=${{ steps.version.outputs.version }}
          for tag in 'macosx_*_arm64' 'macosx_*_x86_64' manylinux_2_28_x86_64 manylinux_2_28_aarch64 win_amd64 win_arm64; do
            compgen -G "wheels/driftmark-$v-py3-none-$tag.whl" > /dev/null || { echo "no wheel for $tag" >&2; exit 1; }
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: driftmark-*
          merge-multiple: true
          path: archives
      - run: node scripts/npm-packages.mjs archives npm-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: npm-packages

  release:
    needs: [build, packages]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release
      id-token: write # signing the attestation
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: driftmark-*
          merge-multiple: true
      - run: sha256sum driftmark-* > SHA256SUMS
      # A signed record of which workflow and commit built each file:
      # gh attestation verify <file> -R cj-ways/driftmark
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: SHA256SUMS
      # Immutable releases: the files go up while the release is a draft, then it is published
      # and can no longer change.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: |
            driftmark-*
            SHA256SUMS
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  # The registry jobs skip a version that is already up, so re-running a failed job finishes the rest.
  crates-io:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # The core first: cargo waits until it is in the index before the program needs it.
      - run: |
          v=${GITHUB_REF_NAME#v}
          for c in driftmark-core driftmark; do
            if curl -sf -A "driftmark-release (github.com/$GITHUB_REPOSITORY)" "https://crates.io/api/v1/crates/$c/$v" > /dev/null; then
              echo "$c $v is already on crates.io"
            else
              cargo publish --locked -p "$c"
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  pypi:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # trusted publishing and attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  npm:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: npm-packages
      # The six system packages first: `driftmark` names them, and an install that finds one
      # missing would get no program. The registry is asked itself; `npm view` can answer from a
      # stale cache. The `./` matters: without it npm reads `npm-packages/<file>.tgz` as a GitHub
      # repository.
      - run: |
          v=${GITHUB_REF_NAME#v}
          publish() {
            if curl -sf "https://registry.npmjs.org/$(printf '%s' "$1" | sed 's|/|%2f|')/$v" > /dev/null; then
              echo "$1 $v is already on npm"
            else
              npm publish "./npm-packages/$2" --access public
            fi
          }
          for s in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            publish "@cj-ways/driftmark-$s" "cj-ways-driftmark-$s-$v.tgz"
          done
          publish driftmark "driftmark-$v.tgz"

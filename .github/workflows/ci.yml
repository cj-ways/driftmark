name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A hosted runner has about 14 GB free. The workspace's test builds with
  # debug info filled it on 2026-10-18 (merman, gix, tokio), so CI builds
  # without debug info or incremental files; test failures still name the
  # file and line.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        # Explicit labels, not *-latest, so a label moving to a new image does not
        # change CI by surprise (ubuntu-latest moves to Ubuntu 26.04 in November
        # 2026). macOS runs on Intel: GitHub's macOS arm64 runners are short of
        # capacity, and four macos-latest jobs waited 15 minutes and were
        # cancelled without a runner on 2026-11-02. The tests check macOS
        # behaviour, not the processor; the release workflow starts the arm64
        # program on an arm64 runner.
        os: [macos-15-intel, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --workspace

  # The presets on public repositories, fetched from GitHub at pinned
  # commits. This is the only job that uses the network; the test job above
  # leaves these tests out.
  presets-public:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p driftmark --test presets_public -- --ignored

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - run: cargo build --locked --workspace

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # The core must stay fully covered: every line, function and branch.
      - run: cargo llvm-cov --locked -p driftmark-core --fail-under-lines 100 --fail-under-functions 100 --fail-under-regions 100

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

[workspace]
resolver = "3"
members = ["crates/driftmark-core", "crates/driftmark"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cj-ways/driftmark"
# The `driftmark` program's search words on crates.io. `driftmark-core` sets
# its own, because a library is found by other words than a command is.
keywords = ["markdown", "diff", "documentation", "mcp", "ai-agents"]
categories = ["command-line-utilities", "development-tools", "text-processing"]

[workspace.lints.rust]
# `deny`, not `forbid`: one block may allow it, the `malloc_trim` declaration
# in crates/driftmark/src/memory.rs (decision 0011, item 4). No other `unsafe`.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"

# `panic = "abort"` is left out on purpose: the program runs a server, and one
# failed request must not stop it.
[profile.release]
lto = true
codegen-units = 1
strip = true
